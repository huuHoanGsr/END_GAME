<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm Quiz FPT Poly - 116 Nguyễn Thị Thập</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #f27024; margin-bottom: 5px; } /* Màu cam Poly */
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 10px 0;
            text-decoration: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-github { background-color: #333; }
        .btn-unity { background-color: #00acc1; }
        .btn:active { transform: scale(0.95); }
        .footer { margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <h2>FPT Polytechnic</h2>
    <p>Dự án 100 Câu hỏi Đúng/Sai</p>
    
    <a href="https://github.com/THANHPHUOC/Project-Game-Quiz" class="btn btn-github" target="_blank">📂 Xem Source Code (GitHub)</a>
    
    <a href="https://play.unity.com/en/games/your-game-id" class="btn btn-unity" target="_blank">🎮 Chơi bản Web (Unity Player)</a>

    <div class="footer">Tested by: Huỳnh Ngọc Thành Phước</div>
</div>

</body>
</html>
